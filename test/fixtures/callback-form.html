<!doctype html><html><body><form data-callback-form data-callback-static aria-label="Request a human callback" class="callback-card">
      <h3>Request your walkthrough</h3><fieldset>
      <div class="field"><label for="callback-name">Name</label><input id="callback-name" name="fullName" autocomplete="name" maxlength="100" required></div>
      <div class="field"><label for="callback-email">Email</label><input id="callback-email" name="email" type="email" autocomplete="email" maxlength="254" placeholder="you@company.com" required></div>
      <div class="field"><label for="callback-phone">Phone number</label><input id="callback-phone" name="phone" type="tel" autocomplete="tel" maxlength="30" placeholder="(555) 555-0123" required></div>
      <div hidden aria-hidden="true"><label>Leave blank<input name="website" tabindex="-1" autocomplete="off"></label></div>
      <label class="callback-consent"><input name="contactConsent" type="checkbox" required><span>I am interested in Roof AI Lead Recovery and request a phone call from its team, including Jesse, at the number provided about its services. This is a request for a human callback, not automated calls or marketing texts. No purchase is required.</span></label>
      <button class="button" type="submit">Request my callback</button>
      </fieldset><p data-callback-status role="status" aria-live="polite"></p><p class="callback-privacy">Your details are used to respond to your inquiry. <a href="/privacy">Privacy policy</a></p>
      <noscript><p>Enable JavaScript to use this form, or <a href="mailto:cory@roofaileadrecovery.com">email cory@roofaileadrecovery.com</a> to request a callback.</p></noscript>
    </form></body></html>
