  <!-- Brand theme for the chat widget. Overrides the @n8n/chat CSS variables
         so the widget matches Roof AI (brand #2563eb, Inter, rounded, soft
         shadows). Must come AFTER the widget stylesheet to win the cascade. -->
  <style>
    :root {
      /* Brand palette */
      --chat--color-primary: #2563eb;
      --chat--color-primary-shade-50: #1d4ed8;
      --chat--color-primary-shade-100: #1e40af;
      --chat--color-secondary: #2563eb;
      --chat--color-secondary-shade-50: #1d4ed8;
      --chat--color-white: #ffffff;
      --chat--color-light: #f1f5f9;
      --chat--color-light-shade-50: #e2e8f0;
      --chat--color-light-shade-100: #cbd5e1;
      --chat--color-medium: #94a3b8;
      --chat--color-dark: #0f172a;
      --chat--color-disabled: #94a3b8;
      --chat--color-typing: #475569;

      /* Typography */
      --chat--font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;

      /* Launcher (floating button) */
      --chat--toggle--background: #2563eb;
      --chat--toggle--hover--background: #1d4ed8;
      --chat--toggle--active--background: #1e40af;
      --chat--toggle--color: #ffffff;
      --chat--toggle--size: 60px;

      /* Window shape + shadow */
      --chat--window--width: 380px;
      --chat--window--height: 600px;
      --chat--border-radius: 1rem;
      --chat--spacing: 1rem;
      --chat--box-shadow: 0 20px 40px -12px rgba(15, 23, 42, 0.28);

      /* Header (gradient, on-brand) */
      --chat--header--background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
      --chat--header--color: #ffffff;
      --chat--header--padding: 1.25rem 1.5rem;
      --chat--heading--font-size: 1.25rem;
      --chat--subtitle--font-size: 0.875rem;
      --chat--subtitle--line-height: 1.4;

      /* Messages */
      --chat--message--font-size: 0.9rem;
      --chat--message--padding: 0.75rem 1rem;
      --chat--message--border-radius: 0.9rem;
      --chat--message-line-height: 1.5;
      --chat--message--bot--background: #ffffff;
      --chat--message--bot--color: #0f172a;
      --chat--message--bot--border: 1px solid #e2e8f0;
      --chat--message--user--background: #2563eb;
      --chat--message--user--color: #ffffff;
      --chat--message--user--border: none;
      --chat--messages-list--padding: 1rem;

      /* Input + send button */
      --chat--input--background: #ffffff;
      --chat--input--border: 1px solid #e2e8f0;
      --chat--input--border-radius: 0.75rem;
      --chat--input--text-color: #0f172a;
      --chat--input--placeholder--font-color: #94a3b8;
      --chat--input--send--button--background: #2563eb;
      --chat--input--send--button--background-hover: #1d4ed8;
      --chat--input--send--button--color: #ffffff;

      /* Body background */
      --chat--body--background: #f8fafc;
    }

    /* Soft-shadow the floating launcher for a more premium feel. */
    .chat-window-toggle {
      box-shadow: 0 10px 25px -6px rgba(37, 99, 235, 0.5) !important;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .chat-window-toggle:hover {
      transform: translateY(-2px);
    }
  </style>
